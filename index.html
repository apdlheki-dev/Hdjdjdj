<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاحص إيميلات الدومينات البريطانية</title>
<style>
  :root{--bg:#0b0e13;--panel:#121821;--line:#1e2836;--txt:#e6edf3;--muted:#8b98a8;
    --ok:#2ea043;--bad:#da3633;--warn:#d29922;--acc:#388bfd;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#16202e 0%,var(--bg) 60%);
    color:var(--txt);min-height:100vh}
  header{padding:26px 20px 8px;text-align:center}
  h1{margin:0;font-size:1.55rem;letter-spacing:.3px}
  h1 span{color:var(--acc)}
  .sub{color:var(--muted);font-size:.88rem;margin-top:6px}
  main{max-width:960px;margin:0 auto;padding:14px 20px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-top:16px}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:8px}
  textarea{width:100%;min-height:150px;resize:vertical;background:#0a0f16;
    border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;
    font-family:ui-monospace,Consolas,monospace;font-size:.88rem;line-height:1.5;outline:none}
  textarea:focus{border-color:var(--acc)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  button{background:var(--acc);color:#fff;border:0;border-radius:10px;
    padding:11px 22px;font-weight:600;font-size:.95rem;cursor:pointer;transition:.15s transform}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;cursor:pointer}
  .toggle input{accent-color:var(--acc);width:16px;height:16px}
  .allowed{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-family:ui-monospace,Consolas,monospace;font-size:.74rem;padding:4px 10px;
    border-radius:999px;background:rgba(56,139,253,.12);border:1px solid rgba(56,139,253,.3);color:#9cc7ff}
  .chip.warn{background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.3);color:#e6c377}
  #status{font-size:.85rem;color:var(--muted);margin-top:12px;min-height:1.2em}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.85rem}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
  .mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600}
  .pill.ok{background:rgba(46,160,67,.15);color:var(--ok);border:1px solid rgba(46,160,67,.3)}
  .pill.bad{background:rgba(218,54,51,.15);color:var(--bad);border:1px solid rgba(218,54,51,.3)}
  .pill.warn{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.3)}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
  .stat{background:#0a0f16;border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .n{font-size:1.4rem;font-weight:700}
  .stat .l{color:var(--muted);font-size:.75rem;margin-top:3px}
  .note{color:var(--muted);font-size:.8rem;margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>فاحص إيميلات <span>الدومينات البريطانية</span></h1>
  <div class="sub">تحقق من الصيغة + MX + SPF + DMARC + SMTP</div>
</header>

<main>
  <div class="card">
    <label for="emails">الإيميلات — واحد في كل سطر (أو لصق مباشر من ملف)</label>
    <textarea id="emails" placeholder="user@blueyonder.co.uk&#10;user@tiscali.co.uk&#10;user@doctors.org.uk"></textarea>

    <div class="allowed" id="allowedChips"></div>

    <div class="row">
      <button id="runBtn">افحص</button>
      <button id="exportBtn" class="ghost" disabled>تصدير CSV</button>
      <button id="clearBtn" class="ghost">تفريغ</button>
      <label class="toggle"><input type="checkbox" id="smtpToggle"> فحص SMTP (قد يفشل على المزودين الكبار)</label>
    </div>
    <div id="status"></div>
    <div class="note">
      ملاحظة: فحص SMTP على المزودين الكبار (Hotmail/Yahoo/Blueyonder/Tiscali) يُتخطّى تلقائياً — سياستهم ترفض
      الفحص بدون سياق حقيقي. الفحص الفعلي الفعّال هناك هو الصيغة + MX + SPF + DMARC.
    </div>
  </div>

  <div class="card" id="summaryCard" style="display:none">
    <div class="summary" id="summaryStats"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <table>
      <thead>
        <tr>
          <th>الإيميل</th>
          <th>الصيغة</th>
          <th>MX</th>
          <th>SPF</th>
          <th>DMARC</th>
          <th>SMTP</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let lastResults = [];
let allowedSet = new Set();
let bigProviderSet = new Set();

function pill(state, text){
  const cls = state === true ? "ok" : state === false ? "bad" : "warn";
  return `<span class="pill ${cls}">${text}</span>`;
}

async function loadConfig(){
  try{
    const r = await fetch("/api/config").then(x => x.json());
    allowedSet = new Set(r.allowedDomains);
    bigProviderSet = new Set(r.bigProviderDomains);
    const wrap = $("allowedChips");
    wrap.innerHTML = "";
    for(const d of r.allowedDomains){
      const c = document.createElement("span");
      c.className = "chip" + (r.bigProviderDomains.includes(d) ? " warn" : "");
      c.textContent = d;
      wrap.appendChild(c);
    }
  }catch{}
}

function parseEmails(raw){
  return raw.split(/[\s,;]+/).map(s => s.trim().toLowerCase())
    .filter(s => s.includes("@") && s.length > 3);
}

async function run(){
  const list = parseEmails($("emails").value);
  if(!list.length){ $("status").textContent = "ما فيه إيميلات صالحة."; return; }

  $("runBtn").disabled = true;
  $("exportBtn").disabled = true;
  $("status").textContent = `جاري الفحص — ${list.length} إيميل...`;

  try{
    const res = await fetch("/api/check", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ emails: list, smtp: $("smtpToggle").checked })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || `HTTP ${res.status}`); }
    render(data);
  }catch(e){
    $("status").textContent = "خطأ: " + e.message;
  }finally{
    $("runBtn").disabled = false;
  }
}

function render(data){
  lastResults = data.results || [];

  // stats
  const s = data.summary;
  $("summaryStats").innerHTML = [
    ["المجموع", s.total],
    ["مقبول", s.accepted],
    ["مرفوض (دومين/صيغة)", s.rejected],
    ["SMTP صالح", s.smtpChecked],
    ["SMTP مرفوض", s.smtpRejected],
    ["SMTP غير محدد", s.smtpUnknown],
  ].map(([l,n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  $("summaryCard").style.display = "block";

  // table
  const body = $("resultBody");
  body.innerHTML = "";
  for(const r of lastResults){
    const tr = document.createElement("tr");
    const smtp = r.smtp
      ? (r.smtp.ok === true ? pill(true, `صالح (${r.smtp.code||'?'})`) :
         r.smtp.ok === false ? pill(false, `مرفوض (${r.smtp.code||'?'})`) :
         pill(null, r.smtp.reason || "غير محدد"))
      : `<span style="color:var(--muted)">—</span>`;
    tr.innerHTML = `
      <td class="mono">${r.email}</td>
      <td>${pill(r.formatOk === false ? false : true, r.formatOk === false ? "خطأ" : "صالح")}</td>
      <td>${pill(r.mxOk, r.mxOk ? "موجود" : "مفقود")}</td>
      <td>${pill(!!r.spf, r.spf ? "موجود" : "مفقود")}</td>
      <td>${pill(!!r.dmarc, r.dmarc ? "موجود" : "مفقود")}</td>
      <td>${smtp}</td>`;
    body.appendChild(tr);
  }
  $("resultCard").style.display = "block";

  // rejected
  if(data.rejected && data.rejected.length){
    $("status").textContent = `خلص. ${data.rejected.length} إيميل مرفوض (دومين غير مسموح أو صيغة خاطئة).`;
  } else {
    $("status").textContent = `خلص — ${lastResults.length} إيميل.`;
  }
  $("exportBtn").disabled = lastResults.length === 0;
}

function exportCsv(){
  if(!lastResults.length) return;
  const headers = ["email","format","mx_ok","spf","dmarc","smtp_state","smtp_code","smtp_reason"];
  const lines = [headers.join(",")];
  for(const r of lastResults){
    const smtpState = r.smtp ? (r.smtp.ok === true ? "valid" : r.smtp.ok === false ? "invalid" : "unknown") : "skipped";
    const row = [
      r.email,
      r.formatOk === false ? "invalid" : "valid",
      r.mxOk ? "yes" : "no",
      r.spf ? "yes" : "no",
      r.dmarc ? "yes" : "no",
      smtpState,
      r.smtp?.code || "",
      (r.smtp?.reason || r.smtp?.message || "").replace(/,/g, ";"),
    ];
    lines.push(row.join(","));
  }
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `uk_email_report_${Date.now()}.csv`;
  a.click();
}

$("runBtn").addEventListener("click", run);
$("exportBtn").addEventListener("click", exportCsv);
$("clearBtn").addEventListener("click", () => {
  $("emails").value = ""; $("resultBody").innerHTML = "";
  $("resultCard").style.display = "none"; $("summaryCard").style.display = "none";
  $("status").textContent = ""; $("exportBtn").disabled = true;
});

loadConfig();
</script>
</body>
</html>
